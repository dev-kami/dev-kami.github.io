<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankIslami App Redirect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        h2 {
            color: #004d40;
        }
        p {
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Opening BankIslami App...</h2>
        <p>If you are not redirected automatically, please choose an option below or check your app status.</p>
    </div>

    <script>
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            var packageName = "com.wallet.bankislami";
            var playStoreUrl = "https://play.google.com/store/apps/details?id=" + packageName;
            var iosAppStoreUrl = "https://apps.apple.com/app/idYOUR_APPLE_APP_ID"; // Yahan apni Apple App ID ya link update kar dein
            var websiteUrl = "https://aikdigital.com";

            // 1. Android Detection
            if (/android/i.test(userAgent)) {
                // Intent approach to open app, fallback to Play Store
                var iframe = document.createElement("iframe");
                iframe.style.display = "none";
                iframe.src = "intent://open#Intent;scheme=bankislami;package=" + packageName + ";end;";
                document.body.appendChild(iframe);

                setTimeout(function() {
                    window.location.href = playStoreUrl;
                }, 1200);
            }
            
            // 2. iOS Detection (iPhone / iPad / iPod)
            else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                var customScheme = "bankislami://";
                window.location.href = customScheme;

                setTimeout(function() {
                    window.location.href = iosAppStoreUrl;
                }, 1500);
            }
            
            // 3. Desktop / Web Detection (Windows, Mac, Linux)
            else {
                window.location.href = websiteUrl;
            }
        };
    </script>

</body>
</html>
